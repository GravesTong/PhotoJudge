name: Bug 报告
description: 提交一个缺陷，帮助我们修复
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug。请尽量提供完整信息，方便快速定位。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 你使用的版本号或 commit。
      placeholder: v0.2.0 或 git hash
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      options:
        - 本地 Windows
        - 本地 macOS
        - 本地 Linux
        - 云端 / Agent
        - 其他
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步一步描述如何触发。
      placeholder: |
        1. 运行 `python score.py --demo`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 贴上报错信息、输出或截图。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 输入
      description: 相关输入文件或完整报错堆栈（可脱敏）。
