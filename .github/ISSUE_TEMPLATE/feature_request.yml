name: 功能请求
description: 提出一个新功能或规则改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请说清"要解决什么问题"，比"要什么功能"更重要。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到的场景 / 痛点是什么？
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望的行为
      description: 你希望新增什么能力 / 规则 / 效果？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 打分规则（rules/）
        - 打分引擎（engine/score.py）
        - 图像标注（engine/annotate.py）
        - 批量/多图
        - 文档 / 示例
        - 其他
  - type: textarea
    id: alternative
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其它做法。
